server:
  port: 8082
spring:
  application:
    name: payment-service
poc:
  event-bus-url: http://localhost:8080
  self-url: http://localhost:8082
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %highlight(%-5level) [PAYMENT ] %msg%n"
